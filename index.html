<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Happy 5th Birthday AR Card</title>
    <!-- Include A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* Status Banner Styling */
      #status-banner {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(255, 105, 180, 0.9);
        color: white;
        padding: 12px 24px;
        font-family: 'Arial', sans-serif;
        font-size: 14px;
        font-weight: bold;
        border-radius: 25px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: background 0.3s ease;
        text-align: center;
      }
    </style>

    <script>
      // Custom Component: Tap to Grow / Shrink Toggable Scale
      AFRAME.registerComponent('tap-grow', {
        init: function () {
          const el = this.el;
          let isExpanded = false;
          el.addEventListener('click', function () {
            isExpanded = !isExpanded;
            const targetScale = isExpanded ? '0.7 0.7 0.7' : '0.4 0.4 0.4';
            el.setAttribute('scale', targetScale);
          });
        }
      });

      // Custom Component: Color Changer Component (adapted from workshop)
      AFRAME.registerComponent('color-changer', {
        init: function () {
          const el = this.el;
          const partyColors = ['#ff1493', '#ff69b4', '#9370db', '#00bfff', '#ff4500'];
          el.addEventListener('click', function () {
            const randomColor = partyColors[Math.floor(Math.random() * partyColors.length)];
            el.setAttribute('material', 'color', randomColor);
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Status Banner HTML Element -->
    <div id="status-banner">🔍 Searching for Hiro Marker... Point camera at marker.</div>

    <!-- AR Scene Setup -->
    <a-scene embedded arjs vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true;" cursor="rayOrigin: mouse;" raycaster="objects: [tap-grow], [color-changer]">
      
      <!-- Hiro Marker -->
      <a-marker preset="hiro" id="hiro-marker">
        
        <!-- Object 1: Cylinder Primitive (Card Base Platform) -->
        <a-cylinder position="0 0 0" radius="0.7" height="0.1" color="#ffb6c1" shadow></a-cylinder>

        <!-- Object 2: Box Primitive (Interactive Gift Box) with color-changer component -->
        <a-box position="-0.5 0.3 0" width="0.35" height="0.35" depth="0.35" color="#ff1493" color-changer shadow></a-box>

        <!-- Object 3: Sphere Primitive (Balloon 1) with Position Animation -->
        <a-sphere position="0.5 0.4 0" radius="0.18" color="#ff69b4" 
                  animation="property: position; to: 0.5 0.75 0; dur: 1400; dir: alternate; loop: true; easing: easeInOutSine">
        </a-sphere>

        <!-- Object 4: Sphere Primitive (Balloon 2) with Rotation Animation -->
        <a-sphere position="-0.5 0.75 0" radius="0.15" color="#dda0dd"
                  animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear">
        </a-sphere>

        <!-- Text Label -->
        <a-text value="Happy 5th Birthday!" position="-0.9 1.1 0" scale="0.7 0.7 0.7" color="#ffffff"></a-text>

        <!-- 3D Model: Birthday Cake (scene.gltf) with tap-grow component -->
        <a-entity gltf-model="url(scene.gltf)" position="0 0.05 0" scale="0.4 0.4 0.4" tap-grow shadow></a-entity>

      </a-marker>

      <!-- Camera Entity -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Status Banner Event Listeners for Marker Tracking
      const marker = document.querySelector('#hiro-marker');
      const banner = document.querySelector('#status-banner');

      marker.addEventListener('markerFound', () => {
        banner.style.backgroundColor = '#4CAF50';
        banner.textContent = '🎉 Marker Found! Happy 5th Birthday! Tap the gift box and cake!';
      });

      marker.addEventListener('markerLost', () => {
        banner.style.backgroundColor = '#ff69b4';
        banner.textContent = '🔍 Marker Lost. Point your camera back at the Hiro marker.';
      });
    </script>
  </body>
</html>
